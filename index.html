<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ระบบจัดการนกฟินเจ็ดสี</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fb;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:#2c3e50;
}

.card{
    background:#fff;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
}

input,select{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-in{
    background:#27ae60;
    color:white;
}

.btn-out{
    background:#e74c3c;
    color:white;
}

.btn-delete{
    background:#6c757d;
    color:white;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.box{
    padding:20px;
    border-radius:15px;
    color:white;
    text-align:center;
}

.box h2{
    margin-bottom:8px;
}

.blue{
    background:#3498db;
}

.green{
    background:#27ae60;
}

.red{
    background:#e74c3c;
}

.purple{
    background:#8e44ad;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th{
    background:#34495e;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.status-available{
    color:#27ae60;
    font-weight:bold;
}

.status-sold{
    color:#e74c3c;
    font-weight:bold;
}

.profit{
    color:#27ae60;
    font-weight:bold;
}

.loss{
    color:#e74c3c;
    font-weight:bold;
}

@media(max-width:768px){

table{
    font-size:12px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>🐦 ระบบจัดการนกฟินเจ็ดสี</h1>
</div>

<div class="card">
<div class="dashboard">

<div class="box blue">
<h2 id="totalBirds">0</h2>
<p>จำนวนทั้งหมด</p>
</div>

<div class="box green">
<h2 id="availableBirds">0</h2>
<p>คงเหลือ</p>
</div>

<div class="box red">
<h2 id="soldBirds">0</h2>
<p>ขายแล้ว</p>
</div>

<div class="box purple">
<h2 id="totalProfit">0</h2>
<p>กำไรสะสม (บาท)</p>
</div>

</div>
</div>

<div class="card">

<h2>🟢 บันทึกรับเข้า</h2>
<br>

<div class="form-grid">

<input type="text" id="ringIn" placeholder="Ring Number">

<input type="text" id="ownerIn" placeholder="ชื่อเจ้าของ">

<select id="genderIn">
<option value="">เลือกเพศ</option>
<option value="ผู้">ผู้</option>
<option value="เมีย">เมีย</option>
</select>

<input type="text" id="colorIn" placeholder="สี">

<input type="number" id="buyPrice" placeholder="ราคาซื้อ">

<input type="date" id="receiveDate">

<button class="btn-in" onclick="addBird()">
บันทึกรับเข้า
</button>

</div>

</div>

<div class="card">

<h2>🔴 บันทึกขายออก</h2>
<br>

<div class="form-grid">

<select id="sellRing"></select>

<input type="date" id="sellDate">

<input type="number"
id="sellPrice"
placeholder="ราคาขาย">

<button class="btn-out"
onclick="sellBird()">

บันทึกขายออก

</button>

</div>

</div>
